services:
  postgres:
    image: postgres:15-alpine
    pull_policy: never
    container_name: workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_engine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_engine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opsional: pgAdmin hanya dijalankan jika diinginkan secara eksplisit
  # Jalankan: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: workflow-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@workflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
